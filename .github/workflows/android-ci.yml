name: Android CI
on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        run: ./gradlew :app:testFullReleaseUnitTest --no-daemon
      - name: Build full/lite release APK
        run: ./gradlew :app:assembleFullRelease :app:assembleLiteRelease --no-daemon
